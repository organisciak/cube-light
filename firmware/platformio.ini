; PlatformIO config for the cube-light firmware.
;
; The GL-C-618WL is a classic ESP32 (WROOM) board — `esp32dev` matches. The
; core pattern engine lives in lib/core (pure C++, shared with the native
; harness in native/, which builds with native/build.sh instead of pio).
;
; First flash goes over USB-C: `pio run -e gledopto618 -t upload`.
; After that, ArduinoOTA allows wireless updates.
;
; IMPORTANT before first flash: open the stock WLED UI and record the LED
; GPIO, color order, and mic pins from its settings pages — that's the
; board's de-facto pin documentation. Then set the build flags below.

[env:gledopto618]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    makuna/NeoPixelBus@^2.8.0
build_flags =
    -std=gnu++17
    -DCUBE_LED_PIN=16          ; VERIFY against stock WLED settings before flashing
    -DCUBE_FPS=30
    ; WiFi credentials: set via env or edit here. If left as AP mode the
    ; cube brings up its own network "cube-light".
    ; -DCUBE_WIFI_SSID=\"yourssid\"
    ; -DCUBE_WIFI_PASS=\"yourpass\"
build_unflags = -std=gnu++11

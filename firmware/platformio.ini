; PlatformIO config for the cube-light firmware.
;
; The GL-C-618WL is a classic ESP32 (WROOM) board — `esp32dev` matches. The
; core pattern engine lives in lib/core (pure C++, shared with the native
; harness in native/, which builds with native/build.sh instead of pio).
;
; First flash goes over USB-C: `pio run -e gledopto618 -t upload`.
; After that, ArduinoOTA allows wireless updates. Recovery is always
; possible over USB: the ESP32's first-stage bootloader lives in mask ROM
; and can't be overwritten — hold the function/BOOT button while plugging
; in to force download mode, then reflash anything (including stock WLED).
;
; IMPORTANT before first flash: open the stock WLED UI and record the LED
; GPIO, color order, button pin, and mic pins from its settings pages —
; that's the board's de-facto pin documentation. Then set the flags below.

[env:gledopto618]
; pioarduino platform for arduino-esp32 3.x / ESP-IDF 5.x. The PlatformIO
; registry's espressif32 platform is frozen at arduino-esp32 2.x (IDF 4.4),
; whose WiFi stack crash-loops on 802.11k/v action frames from mesh routers
; (InstructionFetchError in sta_recv_mgmt/offchan_recv_action during join).
platform = https://github.com/pioarduino/platform-espressif32/archive/refs/tags/55.03.39.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; Custom table: 1.875MB app slots (up from the default 1.25MB). Changing
; this requires a one-time USB flash; NVS offset is unchanged so saved
; settings survive. See partitions_cube.csv.
board_build.partitions = partitions_cube.csv
lib_deps =
    makuna/NeoPixelBus@^2.8.0
    kosme/arduinoFFT@^2.0.2
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
build_flags =
    -std=gnu++17
    ; ---- pins (recorded from this board's stock WLED cfg.json, 2026-07-12;
    ;      backup in docs/wled-backup/) ----
    -DCUBE_LED_PIN=16          ; output 1: LEDs 0..499 (wire order)
    -DCUBE_LED_PIN2=12         ; output 2: LEDs 500..999; -1 = single chain
    -DCUBE_LED_SPLIT=500       ; feed 2nd half at its original start, same direction
    -DCUBE_BUTTON_PIN=17       ; function button (active-low, pullup)
    -DCUBE_RELAY_PIN=18        ; energy-saving relay; MUST be high for LED power
    ; onboard PDM mic (from stock WLED cfg: digitalmic type 5, pins 32/15)
    -DCUBE_MIC_TYPE=1
    -DCUBE_MIC_DATA_PIN=32
    -DCUBE_MIC_CLK_PIN=15
    ; ---- LED string ----
    ; GRB is the board's factory default; the actual seed string is
    ; UNVERIFIED until it's hooked up — change live from the web page.
    -DCUBE_COLOR_ORDER=\"GRB\"
    -DCUBE_FPS=30
    -DCUBE_BRIGHTNESS=1.0f
    ; ---- power (WLED-style auto brightness limiter) ----
    -DCUBE_SUPPLY_MA=10000     ; PSU budget in mA; 0 disables the limiter
    -DCUBE_PER_LED_MA=15       ; full-white draw per LED (12V seed pixels ~15mA)
    ; ---- WiFi: set to join your network; unset = AP mode "cube-light" ----
    ; -DCUBE_WIFI_SSID=\"yourssid\"
    ; -DCUBE_WIFI_PASS=\"yourpass\"
build_unflags = -std=gnu++11

; GL-C-309WL mini — backup/spare controller. Same ESP32-WROOM, but NO USB
; port: the ONLY flash path is OTA (first flash goes through stock WLED's
; Config -> Update page; after that, our own armed ArduinoOTA). Recovery
; from a bad image means opening the case for the serial pads, so only
; ever OTA an image already proven on the 618.
;
; Because the first flash rides WLED's partition table (1.5MB app slots,
; not our 1.875MB custom table — OTA can't redraw the map), the bin MUST
; stay under 1.5MB. Board facts from the label: outputs GND/IO16/V and
; GND/IO2/V, spare pads IO12/IO33, 6A/channel, 10A total. No relay. No
; verified button — see below. NO MICROPHONE: per Gledopto's own manual the
; GL-C-309WL is the mic-less variant (the GL-C-310WL is the same board with
; an I2S mic on SD=26/WS=5/SCK=21). Its stock WLED cfg agrees (audioreactive
; disabled, pins left at WLED defaults). Music-reactive presets are skipped
; by the playlist and the console says "no microphone".
;
; To add one: a PDM mic fits the two spare pads (CLK on IO12 — an output the
; ESP32 drives, so the strapping pin stays quiet at boot — DATA on IO33) with
; -DCUBE_MIC_TYPE=1 -DCUBE_MIC_CLK_PIN=12 -DCUBE_MIC_DATA_PIN=33. Never put
; the mic's DATA on IO12: a mic driving that strapping pin high at reset
; switches the flash voltage and the board won't boot.
[env:gledopto309]
platform = https://github.com/pioarduino/platform-espressif32/archive/refs/tags/55.03.39.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; The board keeps WLED's factory partition table (OTA can't change it) —
; size-check against its 1.5MB app slots. See partitions_wled_4mb.csv.
board_build.partitions = partitions_wled_4mb.csv
lib_deps =
    makuna/NeoPixelBus@^2.8.0
    kosme/arduinoFFT@^2.0.2
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
build_flags =
    -std=gnu++17
    -DCUBE_LED_PIN=16          ; output 1 (matches label); pin is a runtime setting
    -DCUBE_LED_PIN2=-1         ; single chain by default; set pin 2 to GPIO2 live if needed
    -DCUBE_LED_SPLIT=500
    ; Button + relay per this board's stock WLED cfg.json (recorded 2026-08-21
    ; in docs/wled-backup-309/): pushbutton on 17, relay pin 18. Button is
    ; INPUT_PULLUP (safe if actually absent); relay HIGH is harmless if not
    ; fitted, but leaving it low on a fitted relay = dark LEDs.
    -DCUBE_BUTTON_PIN=17
    -DCUBE_RELAY_PIN=18
    -DCUBE_MIC_TYPE=0          ; mic-less board (see note above)
    -DCUBE_MDNS_NAME=\"cube2\" ; second cube on the LAN — don't fight over cube.local
    ; First-boot WiFi baked from the shell env (empty when unset -> AP mode).
    ; Never put real credentials in this file; export CUBE_WIFI_SSID/_PASS
    ; before building a release for this OTA-only board.
    -DCUBE_WIFI_SSID=\"${sysenv.CUBE_WIFI_SSID}\"
    -DCUBE_WIFI_PASS=\"${sysenv.CUBE_WIFI_PASS}\"
    -DCUBE_COLOR_ORDER=\"GRB\"
    -DCUBE_FPS=30
    -DCUBE_BRIGHTNESS=1.0f
    -DCUBE_SUPPLY_MA=10000     ; controller's own 10A ceiling
    -DCUBE_PER_LED_MA=15
build_unflags = -std=gnu++11

; GL-C-310WL — the 309's sibling WITH a microphone: a standard I2S mic on
; SD=26, WS=5, SCK=21 (Gledopto manual: WLED "Generic I2S"). Same no-USB
; caveats as the 309. UNTESTED on real hardware — compiles, pins per the
; manual; verify with /api/audio (frames should climb, rms should move).
[env:gledopto310]
platform = https://github.com/pioarduino/platform-espressif32/archive/refs/tags/55.03.39.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_wled_4mb.csv
lib_deps =
    makuna/NeoPixelBus@^2.8.0
    kosme/arduinoFFT@^2.0.2
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
build_flags =
    -std=gnu++17
    -DCUBE_LED_PIN=16
    -DCUBE_LED_PIN2=-1
    -DCUBE_LED_SPLIT=500
    -DCUBE_BUTTON_PIN=17
    -DCUBE_RELAY_PIN=18
    -DCUBE_MIC_TYPE=2
    -DCUBE_MIC_DATA_PIN=26
    -DCUBE_MIC_WS_PIN=5
    -DCUBE_MIC_CLK_PIN=21
    -DCUBE_MDNS_NAME=\"cube2\"
    -DCUBE_WIFI_SSID=\"${sysenv.CUBE_WIFI_SSID}\"
    -DCUBE_WIFI_PASS=\"${sysenv.CUBE_WIFI_PASS}\"
    -DCUBE_COLOR_ORDER=\"GRB\"
    -DCUBE_FPS=30
    -DCUBE_BRIGHTNESS=1.0f
    -DCUBE_SUPPLY_MA=10000
    -DCUBE_PER_LED_MA=15
build_unflags = -std=gnu++11

; Any classic ESP32 dev board + an INMP441 (or other standard I2S mic) +
; a level-shifted data line to the LEDs. USB flashing, so nothing is gated.
; Pick free GPIOs for your wiring; these are common choices. UNTESTED.
[env:esp32dev-inmp441]
platform = https://github.com/pioarduino/platform-espressif32/archive/refs/tags/55.03.39.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_cube.csv
lib_deps =
    makuna/NeoPixelBus@^2.8.0
    kosme/arduinoFFT@^2.0.2
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
build_flags =
    -std=gnu++17
    -DCUBE_LED_PIN=16
    -DCUBE_LED_PIN2=17
    -DCUBE_LED_SPLIT=500
    -DCUBE_BUTTON_PIN=-1       ; no function button
    -DCUBE_RELAY_PIN=-1        ; no relay
    -DCUBE_MIC_TYPE=2
    -DCUBE_MIC_DATA_PIN=33     ; INMP441 SD
    -DCUBE_MIC_WS_PIN=25       ; INMP441 WS
    -DCUBE_MIC_CLK_PIN=26      ; INMP441 SCK  (L/R pin to GND = left channel)
    -DCUBE_COLOR_ORDER=\"GRB\"
    -DCUBE_FPS=30
    -DCUBE_BRIGHTNESS=1.0f
    -DCUBE_SUPPLY_MA=10000
    -DCUBE_PER_LED_MA=15
build_unflags = -std=gnu++11

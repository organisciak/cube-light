; PlatformIO config for the cube-light firmware.
;
; The GL-C-618WL is a classic ESP32 (WROOM) board — `esp32dev` matches. The
; core pattern engine lives in lib/core (pure C++, shared with the native
; harness in native/, which builds with native/build.sh instead of pio).
;
; First flash goes over USB-C: `pio run -e gledopto618 -t upload`.
; After that, ArduinoOTA allows wireless updates. Recovery is always
; possible over USB: the ESP32's first-stage bootloader lives in mask ROM
; and can't be overwritten — hold the function/BOOT button while plugging
; in to force download mode, then reflash anything (including stock WLED).
;
; IMPORTANT before first flash: open the stock WLED UI and record the LED
; GPIO, color order, button pin, and mic pins from its settings pages —
; that's the board's de-facto pin documentation. Then set the flags below.

[env:gledopto618]
; pioarduino platform for arduino-esp32 3.x / ESP-IDF 5.x. The PlatformIO
; registry's espressif32 platform is frozen at arduino-esp32 2.x (IDF 4.4),
; whose WiFi stack crash-loops on 802.11k/v action frames from mesh routers
; (InstructionFetchError in sta_recv_mgmt/offchan_recv_action during join).
platform = https://github.com/pioarduino/platform-espressif32/archive/refs/tags/55.03.39.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    makuna/NeoPixelBus@^2.8.0
    kosme/arduinoFFT@^2.0.2
build_flags =
    -std=gnu++17
    ; ---- pins (recorded from this board's stock WLED cfg.json, 2026-07-12;
    ;      backup in docs/wled-backup/) ----
    -DCUBE_LED_PIN=16          ; output 1: LEDs 0..499 (wire order)
    -DCUBE_LED_PIN2=12         ; output 2: LEDs 500..999; -1 = single chain
    -DCUBE_LED_SPLIT=500       ; feed 2nd half at its original start, same direction
    -DCUBE_BUTTON_PIN=17       ; function button (active-low, pullup)
    -DCUBE_RELAY_PIN=18        ; energy-saving relay; MUST be high for LED power
    ; mic (for the audio milestone): I2S PDM, DATA=GPIO32, CLK=GPIO15
    ; ---- LED string ----
    ; GRB is the board's factory default; the actual seed string is
    ; UNVERIFIED until it's hooked up — change live from the web page.
    -DCUBE_COLOR_ORDER=\"GRB\"
    -DCUBE_FPS=30
    -DCUBE_BRIGHTNESS=1.0f
    ; ---- power (WLED-style auto brightness limiter) ----
    -DCUBE_SUPPLY_MA=10000     ; PSU budget in mA; 0 disables the limiter
    -DCUBE_PER_LED_MA=15       ; full-white draw per LED (12V seed pixels ~15mA)
    ; ---- WiFi: set to join your network; unset = AP mode "cube-light" ----
    ; -DCUBE_WIFI_SSID=\"yourssid\"
    ; -DCUBE_WIFI_PASS=\"yourpass\"
build_unflags = -std=gnu++11

# Publish the browser simulator (simulator/web, static files + committed WASM)
# to GitHub Pages. Enable Pages with "GitHub Actions" as the source in the
# repo settings once; after that every push to main redeploys.
name: simulator-pages
on:
  push:
    branches: [main]
    paths: ['simulator/web/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: simulator/web
      - id: deployment
        uses: actions/deploy-pages@v4
